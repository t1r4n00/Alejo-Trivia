<!DOCTYPE html>
<html>
<head>
  <title>Alejo Family Trivia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background: linear-gradient(180deg, #e8f7ff, #ffffff);
      text-align: center;
    }

    /* 🔥 Season 4 Banner – Fresh, clean, modern */
    .seasonBanner {
      display: inline-block;
      background: linear-gradient(90deg, #6ecbff, #b5e8ff);
      color: #0f3d57;
      padding: 12px 26px;
      border-radius: 40px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      animation: fadeIn 0.8s ease-out;
    }

    /* Titles */
    h1 {
      font-size: 34px;
      margin-bottom: 10px;
      color: #0f3d57;
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(0,0,0,0.15);
      animation: fadeIn 0.8s ease-out;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 5px;
      color: #444;
    }

    h3 {
      font-size: 18px;
      margin-bottom: 25px;
      color: #666;
    }

    /* Inputs */
    input {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      border-radius: 8px;
      border: 1px solid #bcd7e6;
      margin-bottom: 20px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #6ecbff;
      box-shadow: 0 0 6px rgba(110,203,255,0.5);
    }

    /* Buttons – cleaner, more modern */
    button {
      width: 100%;
      padding: 15px;
      font-size: 22px;
      background: linear-gradient(90deg, #007be8, #0098ff);
      color: white;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: 0.25s;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(90deg, #0069c7, #0084e0);
      transform: translateY(-2px);
    }

    /* Sponsor Section */
    #sponsorBox {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #c7dce8;
      text-align: center;
      font-size: 18px;
      color: #555;
    }

    #sponsorBox img {
      margin-top: 10px;
      max-width: 160px;
      height: auto;
      border-radius: 8px;
      opacity: 0.95;
      transition: 0.2s;
    }

    #sponsorBox img:hover {
      opacity: 1;
    }

    /* Fade-in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<h1>Alejo Family Trivia</h1>

<!-- ⭐ Season 4 Badge -->
<div class="seasonBanner">SEASON 4</div>

<h2>Today's Topic: General Knowledge</h2>
<h3>Time Limit: 45 - 65 Seconds</h3>

<p style="font-size:18px;">Enter your name to begin</p>

<input id="playerName" type="text" placeholder="Your name">

<button onclick="startQuiz()">Start Quiz</button>

<script>
  function startQuiz() {
    const name = document.getElementById("playerName").value.trim();

    if (!name) {
      alert("Please enter your name");
      return;
    }

    localStorage.setItem("playerName", name);
    window.location.href = "quiz.html";
  }
</script>

<div id="sponsorBox">
  <p>Sponsored by</p>
  <img src="logo.png" alt="Sponsor Logo">
</div>

</body>
</html>
