<!DOCTYPE html>
<html>
<head>
  <title>Alejo Family Trivia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 650px;
      margin: auto;
      background: linear-gradient(180deg, #0a0f24, #1a2340);
      text-align: center;
      color: #e8ecff;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #6bb6ff;
      font-weight: bold;
      text-shadow: 0 0 8px #1e90ff;
    }

    .seasonBanner {
      display: inline-block;
      background: linear-gradient(90deg, #00d4ff, #007bff);
      color: #001a33;
      padding: 12px 28px;
      border-radius: 40px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
      box-shadow: 0 0 10px rgba(0, 180, 255, 0.6);
      letter-spacing: 1px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 5px;
      color: #c7d6ff;
    }

    h3 {
      font-size: 18px;
      margin-bottom: 25px;
      color: #9fb4ff;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      border-radius: 6px;
      border: 1px solid #1e90ff;
      background: rgba(255, 255, 255, 0.1);
      color: #e8ecff;
      margin-bottom: 20px;
      box-shadow: 0 0 8px rgba(30,144,255,0.3);
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 22px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(30,144,255,0.6);
      transition: 0.2s;
      font-weight: bold;
    }

    button:hover {
      background: #0f6ad4;
      box-shadow: 0 0 16px rgba(30,144,255,0.9);
    }

    #sponsorBox {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.2);
      text-align: center;
      font-size: 18px;
      color: #c7d6ff;
    }

    #sponsorBox img {
      margin-top: 10px;
      max-width: 160px;
      height: auto;
      border-radius: 6px;
      opacity: 0.9;
      box-shadow: 0 0 10px rgba(0,150,255,0.4);
    }
  </style>
</head>
<body>

<h1>Alejo Family Trivia</h1>

<div class="seasonBanner">SEASON 5</div>

<h2>Today's Topic: World History</h2>
<h3>Time Limit: 45 Seconds</h3>

<p style="font-size:18px; color:#d9e4ff;">Enter your name to begin</p>

<input id="playerName" type="text" placeholder="Your name">

<button onclick="startQuiz()">Start Quiz</button>

<script>
  function startQuiz() {
    const name = document.getElementById("playerName").value.trim();

    if (!name) {
      alert("Please enter your name");
      return;
    }

    localStorage.setItem("playerName", name);
    window.location.href = "quiz.html";
  }
</script>

<div id="sponsorBox">
  <p>Sponsored by</p>
  <img src="logo.png" alt="Sponsor Logo">
</div>

</body>
</html>
