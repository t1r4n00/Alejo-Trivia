<!DOCTYPE html>
<html>
<head>
  <title>Alejo Family Trivia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 650px;
      margin: auto;
      background: linear-gradient(180deg, #0a0f24, #1a2340);
      color: #e8ecff;
      user-select: none;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 5px;
      color: #6bb6ff;
      font-weight: bold;
      text-shadow: 0 0 8px #1e90ff;
    }

    .seasonBanner {
      display: inline-block;
      background: linear-gradient(90deg, #00d4ff, #007bff);
      color: #001a33;
      padding: 10px 26px;
      border-radius: 40px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
      box-shadow: 0 0 10px rgba(0, 180, 255, 0.6);
      letter-spacing: 1px;
    }

    #welcomeName {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #c7d6ff;
    }

    #floatingTimer {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #ff3b3b;
      color: white;
      padding: 12px 18px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      z-index: 9999;
    }

    p {
      font-size: 20px;
      margin-bottom: 10px;
      font-weight: bold;
      color: #d9e4ff;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid rgba(0, 150, 255, 0.3);
      font-size: 18px;
      transition: 0.2s;
    }

    .option:hover {
      background: rgba(0, 150, 255, 0.15);
      border-color: #1e90ff;
      box-shadow: 0 0 8px rgba(0, 150, 255, 0.4);
    }

    .option input {
      margin-right: 12px;
      transform: scale(1.5);
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 25px;
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.6);
      transition: 0.2s;
      font-weight: bold;
    }

    button:hover {
      background: #0f6ad4;
      box-shadow: 0 0 16px rgba(30, 144, 255, 0.9);
    }
  </style>
</head>
<body>

<h1>Alejo Family Trivia</h1>
<div class="seasonBanner">SEASON 5</div>

<p id="welcomeName"></p>
<div id="floatingTimer">45</div>

<form id="quizForm"></form>

<button onclick="submitQuiz()">Submit</button>

<script>
// ---------------------------
// DEFINE QUESTIONS HERE
// ---------------------------
const questions = [
  { name: "q1", text: "Which European country is home to the historic region of Transylvania?", answers: ["Serbia", "Romania", "Austria", "Hungary"], correct: "B", points: 1 },
  { name: "q2", text: "Which ancient civilization built the city of Tenochtitlán on an island in Lake Texcoco?", answers: ["The Maya", "The Inca", "The Aztecs", "The Olmec"], correct: "C", points: 2 },
  { name: "q3", text: "The 'Amber Road' primarily connected the Baltic region with which major ancient empire?", answers: ["The Roman Empire", "The Persian Empire", "The Byzantine Empire", "The Han Dynasty"], correct: "A", points: 3 }
  // Add q4–q6 ONLY on 6‑question days
];

// ---------------------------
// RENDER QUESTIONS
// ---------------------------
const form = document.getElementById("quizForm");

questions.forEach((q, index) => {
  const letter = ["A","B","C","D"];
  let html = `<p>${index+1}. ${q.text}</p>`;
  q.answers.forEach((ans, i) => {
    html += `
      <label class="option">
        <input type="radio" name="${q.name}" value="${letter[i]}"> ${ans}
      </label>`;
  });
  form.innerHTML += html;
});

// ---------------------------
// LOAD NAME
// ---------------------------
const savedName = localStorage.getItem("playerName") || "Unknown";
document.getElementById("welcomeName").innerText = "Player: " + savedName;

// ---------------------------
// TIMER
// ---------------------------
let timeLeft = 45;
let submitted = false;

let timer = setInterval(() => {
  timeLeft--;
  document.getElementById("floatingTimer").innerText = timeLeft;
  if (timeLeft <= 0) {
    clearInterval(timer);
    submitQuiz();
  }
}, 1000);

// ---------------------------
// SUBMIT LOGIC
// ---------------------------
function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timer);

  const data = new FormData(form);
  let score = 0;

  questions.forEach(q => {
    const userAnswer = data.get(q.name) || "";
    localStorage.setItem(q.name, userAnswer);
    if (userAnswer === q.correct) score += q.points;
  });

  localStorage.setItem("baseScore", score.toString());
  window.location.href = "special.html";
}

// ---------------------------
// ANTI‑CHEAT
// ---------------------------
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());
document.addEventListener("paste", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
</script>

</body>
</html>
