<!DOCTYPE html>
<html>
<head>
  <title>Family Trivia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background: linear-gradient(180deg, #f0f4ff, #ffffff);
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 5px;
      color: #1a3d8f;
      font-weight: bold;
    }

    .seasonBanner {
      display: inline-block;
      background: linear-gradient(90deg, #ff9acb, #ffd6e8);
      color: #7a2e4d;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      letter-spacing: 1px;
    }

    #welcomeName {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #444;
    }

    #floatingTimer {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #d9534f;
      color: white;
      padding: 10px 15px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 9999;
    }

    p {
      font-size: 19px;
      margin-bottom: 10px;
      color: #333;
      font-weight: bold;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 12px;
      background: white;
      border-radius: 6px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      font-size: 18px;
      transition: 0.15s;
    }

    .option:hover {
      background: #eef4ff;
      border-color: #bcd0ff;
    }

    .option input {
      margin-right: 10px;
      transform: scale(1.4);
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 22px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 20px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      transition: 0.2s;
    }

    button:hover {
      background: #155ec2;
    }
  </style>
</head>
<body>

<h1>Alejo Family Trivia</h1>
<div class="seasonBanner">SEASON 5</div>

<p id="welcomeName"></p>

<div id="floatingTimer">45</div>

<form id="quizForm">
  <p>1. Which state is home to the famous Sumidero Canyon?</p>
  <label class="option"><input type="radio" name="q1" value="A"> Hidalgo</label>
  <label class="option"><input type="radio" name="q1" value="B"> Veracruz</label>
  <label class="option"><input type="radio" name="q1" value="C"> Tabasco</label>
  <label class="option"><input type="radio" name="q1" value="D"> Chiapas</label>

  <p>2. Which leader drafted much of the 1917 Constitution?</p>
  <label class="option"><input type="radio" name="q2" value="A"> Francisco I. Madero</label>
  <label class="option"><input type="radio" name="q2" value="B"> Plutarco Elías Calles</label>
  <label class="option"><input type="radio" name="q2" value="C"> Álvaro Obregón</label>
  <label class="option"><input type="radio" name="q2" value="D"> Venustiano Carranza</label>

  <p>3. Which ancient city is known for the Pyramid of the Niches?</p>
  <label class="option"><input type="radio" name="q3" value="A"> El Tajín</label>
  <label class="option"><input type="radio" name="q3" value="B"> Uxmal</label>
  <label class="option"><input type="radio" name="q3" value="C"> La Venta</label>
  <label class="option"><input type="radio" name="q3" value="D"> Calakmul</label>

  <button type="button" onclick="submitQuiz()">Submit</button>
</form>

<script>
// Load name
const savedName = localStorage.getItem("playerName") || "Unknown";
document.getElementById("welcomeName").innerText = "Player: " + savedName;

// Timer
let timeLeft = 45;
let timer = setInterval(() => {
  timeLeft--;
  document.getElementById("floatingTimer").innerText = timeLeft;

  if (timeLeft <= 0) {
    clearInterval(timer);
    submitQuiz();
  }
}, 1000);

let submitted = false;

function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timer);

  const form = document.getElementById("quizForm");
  const data = new FormData(form);

  const answers = { q1: "D", q2: "D", q3: "A" };

  let score = 0;
  let q1 = data.get("q1") || "";
  let q2 = data.get("q2") || "";
  let q3 = data.get("q3") || "";

  if (q1 === answers.q1) score += 1;
  if (q2 === answers.q2) score += 2;
  if (q3 === answers.q3) score += 3;

  // Store everything locally for the special page
  localStorage.setItem("baseScore", String(score));
  localStorage.setItem("q1", q1);
  localStorage.setItem("q2", q2);
  localStorage.setItem("q3", q3);

  // Go to special page
  window.location.href = "special.html";
}

// Anti‑cheat basics
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());
document.addEventListener("paste", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
</script>

</body>
</html>
