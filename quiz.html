<!DOCTYPE html>
<html>
<head>
  <title>Alejo Family Trivia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background: linear-gradient(180deg, #e8f7ff, #ffffff);
      text-align: center;
    }

    /* Season 4 Banner */
    .seasonBanner {
      display: inline-block;
      background: linear-gradient(90deg, #6ecbff, #b5e8ff);
      color: #0f3d57;
      padding: 12px 26px;
      border-radius: 40px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #0f3d57;
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    #welcomeName {
      font-size: 20px;
      margin-bottom: 20px;
      color: #444;
    }

    /* Floating Timer */
    #floatingTimer {
      position: fixed;
      top: 15px;
      right: 15px;
      background: #ff4d4d;
      color: white;
      padding: 12px 18px;
      border-radius: 50%;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }

    /* Question text */
    p {
      font-size: 20px;
      color: #333;
      text-align: left;
      margin-top: 25px;
      margin-bottom: 10px;
    }

    /* Options */
    .option {
      display: block;
      text-align: left;
      background: #ffffff;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #bcd7e6;
      transition: 0.2s;
      font-size: 18px;
    }

    .option:hover {
      background: #e8f7ff;
      border-color: #6ecbff;
    }

    /* Submit Button */
    button {
      width: 100%;
      padding: 15px;
      font-size: 22px;
      background: linear-gradient(90deg, #007be8, #0098ff);
      color: white;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: 0.25s;
      margin-top: 25px;
    }

    button:hover {
      background: linear-gradient(90deg, #0069c7, #0084e0);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<h1>Alejo Family Trivia</h1>
<div class="seasonBanner">SEASON 4</div>

<p id="welcomeName"></p>

<div id="floatingTimer">45</div>

<form id="quizForm">
  <p>1. Which Mexican state is home to the city of Culiacán?</p>
  <label class="option"><input type="radio" name="q1" value="A"> Sonora</label>
  <label class="option"><input type="radio" name="q1" value="B"> Sinaloa</label>
  <label class="option"><input type="radio" name="q1" value="C"> Nayarit</label>
  <label class="option"><input type="radio" name="q1" value="D"> Durango</label>

  <p>2. Which revolutionary leader was known as “El Caudillo del Sur”?</p>
  <label class="option"><input type="radio" name="q2" value="A"> Pancho Villa</label>
  <label class="option"><input type="radio" name="q2" value="B"> Emiliano Zapata</label>
  <label class="option"><input type="radio" name="q2" value="C"> Venustiano Carranza</label>
  <label class="option"><input type="radio" name="q2" value="D"> Álvaro Obregón</label>

  <p>3. Which ancient city was the capital of the Zapotec civilization?</p>
  <label class="option"><input type="radio" name="q3" value="A"> Palenque</label>
  <label class="option"><input type="radio" name="q3" value="B"> Teotihuacán</label>
  <label class="option"><input type="radio" name="q3" value="C"> Monte Albán</label>
  <label class="option"><input type="radio" name="q3" value="D"> Tulum</label>

  <button type="button" onclick="submitQuiz()">Submit</button>
</form>

<script>
// Load name
const savedName = localStorage.getItem("playerName") || "Unknown";
document.getElementById("welcomeName").innerText = "Player: " + savedName;

// Timer
let timeLeft = 45;
let timer = setInterval(() => {
  timeLeft--;
  document.getElementById("floatingTimer").innerText = timeLeft;

  if (timeLeft <= 0) {
    clearInterval(timer);
    submitQuiz();
  }
}, 1000);

let submitted = false;

function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timer);

  const form = document.getElementById("quizForm");
  const data = new FormData(form);

  const answers = { q1: "B", q2: "B", q3: "C" };

  let score = 0;
  let q1 = data.get("q1") || "";
  let q2 = data.get("q2") || "";
  let q3 = data.get("q3") || "";

  if (q1 === answers.q1) score += 1;
  if (q2 === answers.q2) score += 2;
  if (q3 === answers.q3) score += 3;

  localStorage.setItem("baseScore", String(score));
  localStorage.setItem("q1", q1);
  localStorage.setItem("q2", q2);
  localStorage.setItem("q3", q3);

  window.location.href = "special.html";
}

// Anti‑cheat basics
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());
document.addEventListener("paste", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
</script>

</body>
</html>
