<!DOCTYPE html>
<html>
<head>
  <title>Español del Día</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 650px;
      margin: auto;
      background: linear-gradient(180deg, #0a0f24, #1a2340);
      color: #e8ecff;
      user-select: none;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 5px;
      color: #6bb6ff;
      font-weight: bold;
      text-shadow: 0 0 8px #1e90ff;
    }

    .seasonBanner {
      display: inline-block;
      background: linear-gradient(90deg, #00d4ff, #007bff);
      color: #001a33;
      padding: 10px 26px;
      border-radius: 40px;
      font-size: 20px;
      font-weight: bold;
      margin: 10px auto 25px auto;
      box-shadow: 0 0 10px rgba(0, 180, 255, 0.6);
      letter-spacing: 1px;
      text-align: center;
    }

    #floatingTimer {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #ff3b3b;
      color: white;
      padding: 12px 18px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      z-index: 9999;
    }

    .optionBlock, #mcqBlock, #writeBlock {
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(0, 150, 255, 0.3);
      box-shadow: 0 0 8px rgba(0, 150, 255, 0.2);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border-radius: 6px;
      border: 1px solid #1e90ff;
      background: rgba(255, 255, 255, 0.1);
      color: #e8ecff;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 25px;
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.6);
      transition: 0.2s;
      font-weight: bold;
    }

    button:hover {
      background: #0f6ad4;
      box-shadow: 0 0 16px rgba(30, 144, 255, 0.9);
    }
  </style>
</head>
<body>

<h1>Español del Día</h1>
<div class="seasonBanner">SEASON 5</div>

<div id="floatingTimer">20</div>

<p>Translate to English: "Balin" (slang)</p>

<div class="optionBlock">
  <label><input type="radio" name="mode" value="mcq"> Multiple Choice (1 pt)</label><br>
  <label><input type="radio" name="mode" value="write"> Write the Answer (2 pts, +0.5 perfect spelling)</label>
</div>

<div id="mcqBlock" style="display:none;">
  <label><input type="radio" name="special" value="A"> Extremely spicy</label><br>
  <label><input type="radio" name="special" value="B"> Hard to understand</label><br>
  <label><input type="radio" name="special" value="C"> Fake or low‑quality</label><br>
  <label><input type="radio" name="special" value="D"> Very old</label>
</div>

<div id="writeBlock" style="display:none;">
  <input id="writtenAnswer" type="text" placeholder="Type your answer">
</div>

<button onclick="submitSpecial()">Submit</button>

<script>
let timeLeft = 20;
let submitted = false;

let timer = setInterval(() => {
  timeLeft--;
  document.getElementById("floatingTimer").innerText = timeLeft;
  if (timeLeft <= 0) {
    clearInterval(timer);
    submitSpecial();
  }
}, 1000);

document.querySelectorAll("input[name='mode']").forEach(r => {
  r.addEventListener("change", () => {
    const mode = r.value;
    document.getElementById("mcqBlock").style.display = mode === "mcq" ? "block" : "none";
    document.getElementById("writeBlock").style.display = mode === "write" ? "block" : "none";
  });
});

function submitSpecial(fromTimer = false) {
  if (submitted) return;
  submitted = true;
  clearInterval(timer);

  // Disable all inputs
  document.querySelectorAll("input, button").forEach(el => el.disabled = true);

  const modeInput = document.querySelector("input[name='mode']:checked");
  let modeValue = modeInput ? modeInput.value : null;

  // If timer ended and no mode chosen
  if (!modeValue) {
    if (!fromTimer) {
      alert("Please choose an answer type");
      submitted = false;
      document.querySelectorAll("input, button").forEach(el => el.disabled = false);
      return;
    } else {
      modeValue = "none";
    }
  }

  let finalScore = baseScore;
  let q4 = "";
  let q4_written = "";

  // MCQ scoring
  if (modeValue === "mcq") {
    q4 = document.querySelector("input[name='q4']:checked")?.value || "";
    if (q4 === "A") {
      finalScore += 1;
    }
  }

  // Written answer (no auto points)
  if (modeValue === "write" || modeValue === "mex") {
    q4_written = document.getElementById("writtenAnswer").value.trim();
  }

  // ---------------------------
  // SEND TO GOOGLE SHEETS
  // ---------------------------
  const payload = {
    name: name,
    score: finalScore,
    q1: q1,
    q2: q2,
    q3: q3,
    q4_main: q4_main,
    q5: q5,
    q6: q6,
    q4: q4,
    q4_written: q4_written,
    mode: modeValue
  };

  fetch("https://script.google.com/macros/s/AKfycbzYWhQMA4pYWXzivVfBLTURs5vHqXwWwdn2B8zQbJGcghXIF9ZuiyG4EbWbXZMkrRN_/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  // ---------------------------
  // SHOW FINAL SCORE ON SAME PAGE
  // ---------------------------
  const box = document.createElement("div");
  box.style.marginTop = "30px";
  box.style.padding = "25px";
  box.style.background = "white";
  box.style.borderRadius = "10px";
  box.style.fontSize = "22px";
  box.style.textAlign = "center";
  box.style.boxShadow = "0 3px 10px rgba(0,0,0,0.15)";

  if (modeValue === "mcq") {
    box.innerHTML = `
      <h2 style="color:#b03060;">All Done!</h2>
      <p>Your final score is:</p>
      <p style="font-size:42px; color:#b03060; font-weight:bold;">${finalScore}</p>
    `;
  } else if (modeValue === "none") {
    box.innerHTML = `
      <h2 style="color:#b03060;">Time's Up!</h2>
      <p>No answer was selected.</p>
      <p>Your score remains:</p>
      <p style="font-size:42px; color:#b03060; font-weight:bold;">${baseScore}</p>
    `;
  } else {
    box.innerHTML = `
      <h2 style="color:#b03060;">Answer Submitted!</h2>
      <p>Your score so far:</p>
      <p style="font-size:42px; color:#b03060; font-weight:bold;">${baseScore}</p>
      <p>Your written answer will be graded manually.</p>
    `;
  }

  document.body.innerHTML = "";
  document.body.appendChild(box);
}
</script>

</body>
</html>
