<!DOCTYPE html>
<html>
<head>
  <title>Español del Día</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 650px;
      margin: auto;
      background: linear-gradient(180deg, #0a0f24, #1a2340);
      color: #e8ecff;
      user-select: none;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 5px;
      color: #6bb6ff;
      font-weight: bold;
      text-shadow: 0 0 8px #1e90ff;
    }

    .seasonBanner {
      display: inline-block;
      background: linear-gradient(90deg, #00d4ff, #007bff);
      color: #001a33;
      padding: 10px 26px;
      border-radius: 40px;
      font-size: 20px;
      font-weight: bold;
      margin: 10px auto 25px auto;
      box-shadow: 0 0 10px rgba(0, 180, 255, 0.6);
      letter-spacing: 1px;
      text-align: center;
    }

    #floatingTimer {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #ff3b3b;
      color: white;
      padding: 12px 18px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      z-index: 9999;
    }

    .optionBlock, #mcqBlock, #writeBlock {
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(0, 150, 255, 0.3);
      box-shadow: 0 0 8px rgba(0, 150, 255, 0.2);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border-radius: 6px;
      border: 1px solid #1e90ff;
      background: rgba(255, 255, 255, 0.1);
      color: #e8ecff;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 25px;
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.6);
      transition: 0.2s;
      font-weight: bold;
    }

    button:hover {
      background: #0f6ad4;
      box-shadow: 0 0 16px rgba(30, 144, 255, 0.9);
    }
  </style>
</head>
<body>

<h1>Español del Día</h1>
<div class="seasonBanner">SEASON 5</div>

<div id="floatingTimer">20</div>

<p>Translate to English: "Balin" (slang)</p>

<div class="optionBlock">
  <label><input type="radio" name="mode" value="mcq"> Multiple Choice (1 pt)</label><br>
  <label><input type="radio" name="mode" value="write"> Write the Answer (2 pts, +0.5 perfect spelling)</label>
</div>

<div id="mcqBlock" style="display:none;">
  <label><input type="radio" name="special" value="A"> Extremely spicy</label><br>
  <label><input type="radio" name="special" value="B"> Hard to understand</label><br>
  <label><input type="radio" name="special" value="C"> Fake or low‑quality</label><br>
  <label><input type="radio" name="special" value="D"> Very old</label>
</div>

<div id="writeBlock" style="display:none;">
  <input id="writtenAnswer" type="text" placeholder="Type your answer">
</div>

<button onclick="submitSpecial()">Submit</button>

<script>
let timeLeft = 20;
let submitted = false;

let timer = setInterval(() => {
  timeLeft--;
  document.getElementById("floatingTimer").innerText = timeLeft;
  if (timeLeft <= 0) {
    clearInterval(timer);
    submitSpecial();
  }
}, 1000);

document.querySelectorAll("input[name='mode']").forEach(r => {
  r.addEventListener("change", () => {
    const mode = r.value;
    document.getElementById("mcqBlock").style.display = mode === "mcq" ? "block" : "none";
    document.getElementById("writeBlock").style.display = mode === "write" ? "block" : "none";
  });
});

function submitSpecial() {
  if (submitted) return;
  submitted = true;
  clearInterval(timer);

  const baseScore = Number(localStorage.getItem("baseScore") || "0");
  let finalScore = baseScore;

  const mode = document.querySelector("input[name='mode']:checked");
  if (!mode) {
    alert("Select a mode first");
    return;
  }

  const correctLetter = "A";

  if (mode.value === "mcq") {
    const ans = document.querySelector("input[name='special']:checked");
    if (ans && ans.value === correctLetter) {
      finalScore += 1;
    }
  }

  if (mode.value === "write") {
    const text = document.getElementById("writtenAnswer").value.trim();
    localStorage.setItem("writtenAnswer", text);
  }

  localStorage.setItem("finalScore", finalScore.toString());

  // ---------------------------
  // SEND TO GOOGLE SHEETS
  // ---------------------------
  const payload = {
    name: localStorage.getItem("playerName") || "",
    baseScore: baseScore,
    finalScore: finalScore,
    q1: localStorage.getItem("q1") || "",
    q2: localStorage.getItem("q2") || "",
    q3: localStorage.getItem("q3") || "",
    q4: localStorage.getItem("q4") || "",
    q5: localStorage.getItem("q5") || "",
    q6: localStorage.getItem("q6") || "",
    specialMode: mode.value,
    specialMCQ: document.querySelector("input[name='special']:checked")?.value || "",
    specialWritten: document.getElementById("writtenAnswer").value.trim() || ""
  };

  fetch("https://script.google.com/macros/s/AKfycbzYWhQMA4pYWXzivVfBLTURs5vHqXwWwdn2B8zQbJGcghXIF9ZuiyG4EbWbXZMkrRN_/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  window.location.href = "results.html";
}
</script>

</body>
</html>
