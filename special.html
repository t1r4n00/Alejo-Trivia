<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
  <title>Español del Día</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background: linear-gradient(180deg, #e8f7ff, #ffffff);
      user-select: none;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #0f3d57;
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* Season 4 Banner */
    .seasonBanner {
      display: inline-block;
      background: linear-gradient(90deg, #6ecbff, #b5e8ff);
      color: #0f3d57;
      padding: 12px 26px;
      border-radius: 40px;
      font-size: 20px;
      font-weight: bold;
      margin: 10px auto 25px auto;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    /* Floating Timer */
    #floatingTimer {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #ff4d4d;
      color: white;
      padding: 12px 18px;
      border-radius: 50%;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      z-index: 9999;
    }

    /* Word */
    .wordBox {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }

    /* Mode selection block */
    .optionBlock {
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      border: 1px solid #bcd7e6;
      text-align: left;
    }

    .optionBlock label {
      display: block;
      font-size: 18px;
      padding: 10px;
      border-radius: 6px;
      transition: 0.2s;
    }

    .optionBlock label:hover {
      background: #e8f7ff;
      border-color: #6ecbff;
    }

    /* MCQ options */
    #mcqBlock label {
      display: block;
      text-align: left;
      background: #ffffff;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #bcd7e6;
      transition: 0.2s;
      font-size: 18px;
    }

    #mcqBlock label:hover {
      background: #e8f7ff;
      border-color: #6ecbff;
    }

    /* Written answer */
    #writtenAnswer {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      border-radius: 8px;
      border: 1px solid #bcd7e6;
      transition: 0.2s;
    }

    #writtenAnswer:focus {
      border-color: #6ecbff;
      box-shadow: 0 0 6px rgba(110,203,255,0.5);
    }

    /* Submit button */
    button {
      width: 100%;
      padding: 15px;
      font-size: 22px;
      background: linear-gradient(90deg, #007be8, #0098ff);
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: 0.25s;
    }

    button:hover {
      background: linear-gradient(90deg, #0069c7, #0084e0);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<h1>Español del Día</h1>
<div class="seasonBanner">SEASON 5</div>

<div id="floatingTimer">20</div>

<p class="wordBox">Translate to English: "Cuchitril" (slang)</p>

<div class="optionBlock">
  <label><input type="radio" name="mode" value="mcq"> Multiple Choice (+1)</label>
  <label><input type="radio" name="mode" value="write"> Write the Answer (+2, +0.5 correct spelling)</label>
</div>

<div id="mcqBlock" style="display:none; margin-bottom:15px;">
  <label><input type="radio" name="q4" value="A"> A small mountain pass</label>
  <label><input type="radio" name="q4" value="B"> A handmade wooden tool</label>
  <label><input type="radio" name="q4" value="C"> A cramped, messy, or shabby room</label>
  <label><input type="radio" name="q4" value="D"> A type of rural bread oven</label>
</div>

<div id="writeBlock" style="display:none; margin-bottom:15px;">
  <input id="writtenAnswer" type="text" placeholder="Type your answer">
</div>

<button onclick="submitSpecial()">Submit</button>

<script>
/* Your original JS — unchanged */
let timeLeft = 20;
let addedTime = false;
let submitted = false;
let timer;

const baseScore = Number(localStorage.getItem("baseScore") || "0");
const name = localStorage.getItem("playerName") || "Unknown";
const q1 = localStorage.getItem("q1") || "";
const q2 = localStorage.getItem("q2") || "";
const q3 = localStorage.getItem("q3") || "";

if (!localStorage.getItem("baseScore")) {
  document.body.innerHTML = "<h2 style='text-align:center;'>Session expired. Please start again.</h2>";
} else {
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("floatingTimer").innerText = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timer);
      submitSpecial(true);
    }
  }, 1000);
}

document.querySelectorAll("input[name='mode']").forEach(r => {
  r.addEventListener("change", () => {
    const mode = r.value;

    document.getElementById("mcqBlock").style.display = mode === "mcq" ? "block" : "none";
    document.getElementById("writeBlock").style.display = mode === "write" ? "block" : "none";

    if (mode === "write" && !addedTime) {
      timeLeft += 5;
      addedTime = true;
    }

    document.querySelectorAll("input[name='mode']").forEach(m => m.disabled = true);
  });
});

function submitSpecial(fromTimer = false) {
  if (submitted) return;
  submitted = true;
  clearInterval(timer);

  document.querySelectorAll("input, button").forEach(el => el.disabled = true);

  const modeInput = document.querySelector("input[name='mode']:checked");
  let modeValue = modeInput ? modeInput.value : null;

  if (!modeValue) {
    if (!fromTimer) {
      alert("Please choose an answer type");
      submitted = false;
      document.querySelectorAll("input, button").forEach(el => el.disabled = false);
      return;
    } else {
      modeValue = "none";
    }
  }

  let finalScore = baseScore;
  let q4 = "";
  let q4_written = "";

  if (modeValue === "mcq") {
    q4 = document.querySelector("input[name='q4']:checked")?.value || "";
    if (q4 === "C") finalScore += 1;
  } else if (modeValue === "write") {
    q4_written = document.getElementById("writtenAnswer").value.trim();
  }

  const payload = {
    name, score: finalScore, q1, q2, q3, q4, q4_written, mode: modeValue
  };

  fetch("https://script.google.com/macros/s/AKfycbzYWhQMA4pYWXzivVfBLTURs5vHqXwWwdn2B8zQbJGcghXIF9ZuiyG4EbWbXZMkrRN_/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const box = document.createElement("div");
  box.style.marginTop = "30px";
  box.style.padding = "20px";
  box.style.background = "white";
  box.style.borderRadius = "8px";
  box.style.fontSize = "22px";
  box.style.textAlign = "center";

  if (modeValue === "mcq") {
    box.innerHTML = `
      <h2>All Done!</h2>
      <p>Your final score is:</p>
      <p style="font-size:40px; color:#b03060; font-weight:bold;">${finalScore}</p>
    `;
  } else if (modeValue === "none") {
    box.innerHTML = `
      <h2>Time's Up!</h2>
      <p>No answer was selected in time.</p>
      <p>Current score: <strong>${baseScore}</strong></p>
    `;
  } else {
    box.innerHTML = `
      <h2>Answer Submitted!</h2>
      <p>Current score: <strong>${baseScore}</strong></p>
      <p>Final score will be determined based on your written answer.</p>
    `;
  }

  document.body.innerHTML = "";
  document.body.appendChild(box);
}

/* Anti-cheat */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());
document.addEventListener("paste", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
</script>

</body>
</html>
